name: regenerate self-hosted assets

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
  workflow_dispatch:

jobs:
  regenerate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow numpy
      - run: python3 scripts/banner/generate.py
      - run: python3 scripts/skills_radar.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ scripts/banner/avatar.png
          git diff --staged --quiet || git commit -m "chore: regenerate self-hosted assets"
          git push
