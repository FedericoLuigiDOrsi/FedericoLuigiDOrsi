name: regenerate stats card

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/cards.py"
  workflow_dispatch:

jobs:
  regenerate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/cards.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/card-stats-dark.svg assets/card-stats-light.svg
          git diff --staged --quiet || git commit -m "chore: regenerate stats card"
          git push
